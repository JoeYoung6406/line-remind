name: LINE 聚會提醒

on:
  # 準點觸發改由 Cloudflare Worker Cron（每週二 19:00 台北）dispatch，
  # 不用 GitHub schedule（整點常延遲數小時）。這裡只保留手動觸發與 watchdog 補發。
  workflow_dispatch:

permissions:
  contents: write          # 發送後把結果寫回 SEND_LOG.md

# 避免 watchdog 誤判失敗、重新觸發，跟上一次還沒跑完的執行同時搶 git/LINE。
concurrency:
  group: line-remind-weekly
  cancel-in-progress: false

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run reminder
        id: send
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python remind.py

      # 只是寫紀錄，失敗不該讓整個 job 被判定成「失敗」（會害 watchdog 誤判重複補發）。
      # git add -A 把任何既有未暫存變動一起收進這次 commit，避免 push 失敗時
      # 才 pull --rebase 卻因工作目錄不乾淨而報錯。
      - name: Record send log
        if: always() && steps.send.outcome != 'skipped'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "| $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') | ${{ github.workflow }} | ${{ github.event_name }} | ${{ steps.send.outcome }} |" >> SEND_LOG.md
          git add -A
          git commit -m "log: 發送紀錄 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" || echo "nothing to commit"
          git push || (git pull --rebase origin main && git push)
