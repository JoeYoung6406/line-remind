name: 發送監控（漏發自動補發）

on:
  schedule:
    - cron: '0 0 * * *'    # 台北每天 08:00，檢查每日靈修（06:00 發送）
    - cron: '0 13 * * 2'   # 台北週二 21:00，檢查聚會提醒（19:00 發送）
  workflow_dispatch:
    inputs:
      target:
        description: '要檢查的 workflow'
        type: choice
        options:
          - daily_plan.yml
          - remind.yml
        default: daily_plan.yml

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 判斷檢查目標
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "wf=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" -ge 12 ]; then
            echo "wf=remind.yml" >> "$GITHUB_OUTPUT"
          else
            echo "wf=daily_plan.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: 檢查是否已成功發送，漏發就自動補發
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wf="${{ steps.target.outputs.wf }}"

          # 用「台北日曆日期」判斷有沒有發過，不用「過去N小時」的滑動窗口。
          # 原本用「過去6小時內有沒有成功」來判斷，但 Cloudflare 準點發送（06:00）
          # 跟 watchdog 自己（延遲後可能中午甚至下午才跑）之間的間隔常常超過6小時，
          # 會誤判「沒發過」而重複補發一次。改成比對日期就不會再受 watchdog 自己
          # 延遲多久影響。
          if [ "$wf" = "remind.yml" ]; then
            # remind.yml 只在週二發送，參考日期抓「最近一個週二」（今天就是週二的話就是今天）
            dow=$(TZ=Asia/Taipei date +%u)  # 1=一 … 7=日
            back=$(( (dow - 2 + 7) % 7 ))
            ref=$(TZ=Asia/Taipei date -d "-${back} days" +%Y-%m-%d)
          else
            ref=$(TZ=Asia/Taipei date +%Y-%m-%d)
          fi

          sent=""
          for t in $(gh run list --workflow="$wf" --limit 20 --json conclusion,createdAt \
                     --jq '.[] | select(.conclusion=="success") | .createdAt'); do
            d=$(TZ=Asia/Taipei date -d "$t" +%Y-%m-%d)
            if [ "$d" = "$ref" ]; then
              sent="yes"
              break
            fi
          done

          if [ -n "$sent" ]; then
            echo "$wf 在台北 $ref 已經有成功發送，一切正常。"
            exit 0
          fi
          echo "::warning::$wf 在台北 $ref 還沒有成功發送，自動補發一次。"
          gh workflow run "$wf"
          sleep 30
          run_id=$(gh run list --workflow="$wf" --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run watch "$run_id" --exit-status
          echo "補發成功。"
