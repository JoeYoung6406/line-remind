name: 每日計畫發送

on:
  # 準點觸發改由 Cloudflare Worker Cron（每天 06:00 台北）dispatch，
  # 不用 GitHub schedule（整點常延遲數小時）。這裡只保留手動觸發與 watchdog 補發。
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (截圖但不發 LINE)'
        type: boolean
        default: false

permissions:
  contents: write

# 避免 watchdog 誤判失敗、重新觸發，跟上一次還沒跑完的執行同時搶 git/LINE。
concurrency:
  group: line-remind-daily-plan
  cancel-in-progress: false

jobs:
  send-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Take screenshot
        run: python daily_plan.py

      - name: Commit screenshot to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plan.png
          git diff --staged --quiet || git commit -m "Daily plan $(date +%Y-%m-%d)"
          git push || (git pull --rebase origin main && git push)

      - name: Wait for GitHub CDN
        run: sleep 30

      - name: Send LINE message
        id: send
        if: ${{ inputs.dry_run != true }}
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_TOKEN_B: ${{ secrets.LINE_TOKEN_B }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: python send_daily.py

      # 只是寫紀錄，失敗不該讓整個 job 被判定成「失敗」（會害 watchdog 誤判重複補發）。
      # git add -A 把任何既有未暫存變動一起收進這次 commit，避免 push 失敗時
      # 才 pull --rebase 卻因工作目錄不乾淨而報錯。
      - name: Record send log
        if: always() && steps.send.outcome != 'skipped'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "| $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') | ${{ github.workflow }} | ${{ github.event_name }} | ${{ steps.send.outcome }} |" >> SEND_LOG.md
          git add -A
          git commit -m "log: 發送紀錄 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" || echo "nothing to commit"
          git push || (git pull --rebase origin main && git push)
